[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line too long — handled by formatter
    "E402",   # module-level import not at top — needed in alembic env.py
    "B008",   # function-call-in-default-argument — FastAPI Depends() is intentional
    "B904",   # raise-without-from-inside-except — convention, not a bug
    "B905",   # zip-without-explicit-strict — acceptable
]

[tool.ruff.lint.isort]
known-first-party = ["inference", "backend"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]